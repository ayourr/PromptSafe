name: release

# Publish a GitHub Release with the binaries, either by pushing a version tag
# (git tag v0.2.0 && git push origin v0.2.0) or from the Actions tab
# ("Run workflow" with a version): the tag is then created on the chosen branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, e.g. v0.2.0 (created on the selected branch if new)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/promptsafe-${os}-${arch}${ext}" ./cmd/promptsafe
          done
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist && sha256sum * > checksums.txt && cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "PromptSafe $TAG" --generate-notes
          fi
